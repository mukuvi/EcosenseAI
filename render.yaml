databases:
  - name: ecosense-db
    databaseName: ecosense_ai
    user: ecosense
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: ecosense-api
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: node src/db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: ecosense-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecosense-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ecosense-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ecosense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecosense-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: AI_SERVICE_URL
        value: http://ecosense-ai:10000
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: ecosense-uploads
      mountPath: /app/uploads
      sizeGB: 1

  - type: web
    name: ecosense-ai
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: ai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: ecosense-web
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: web
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: http://ecosense-api:10000
