# Render blueprint for EcoSense AI.
#
# Deploy with: Dashboard -> New -> Blueprint -> pick this repo.
# Render does not run docker-compose.yml, so each service is declared here
# instead. Region: Frankfurt (closest to East Africa). Swap to oregon/ohio if
# your users are elsewhere. Keep every service in the same region so the
# internal URLs below resolve.

databases:
  - name: ecosense-db
    databaseName: ecosense_ai
    user: ecosense
    plan: free # free Postgres expires after 30 days; upgrade to basic-256mb for anything longer
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # Express API + photo uploads.
  # Listens on the PORT Render injects (10000 by default), not 5000.
  - type: web
    name: ecosense-api
    runtime: docker
    region: frankfurt
    plan: starter # 512 MB; bump to standard if sharp/photo traffic needs more
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: node src/db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: ecosense-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecosense-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ecosense-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ecosense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecosense-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: http://ecosense-ai:10000
      # Photos must live on the disk, not the container filesystem.
      - key: UPLOAD_DIR
        value: /app/uploads
      # Seed demo data once after the first deploy with:
      # Render Shell -> node src/db/seed.js
    disk:
      name: ecosense-uploads
      mountPath: /app/uploads
      sizeGB: 1

  # FastAPI classifier / hotspot / routing service.
  # Heuristic fallback only until you commit a model to ai/models/.
  - type: web
    name: ecosense-ai
    runtime: docker
    region: frankfurt
    plan: starter # 512 MB is enough while no TensorFlow model is loaded
    rootDir: ai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  # Static React dashboard, built by Vite and served by nginx.
  # nginx also proxies /api and /uploads to the API service, so the browser
  # talks to one origin and CORS stays out of the way.
  - type: web
    name: ecosense-web
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: web
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: http://ecosense-api:10000
